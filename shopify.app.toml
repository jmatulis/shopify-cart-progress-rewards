# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c5db19d7e4c48f386fb3e9be25578d9e"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
name = "Store Project"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = ""

[webhooks]
api_version = "2026-10"

  # Webhook URIs are resolved against application_url, which is Shopify's
  # placeholder while the app runs from a dev tunnel, so Shopify rejects them on
  # deploy. Uncomment both subscriptions once the app is hosted at a stable URL;
  # the handlers already exist in app/routes/webhooks.app.*.tsx.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/app/uninstalled"
  # topics = [ "app/uninstalled" ]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/app/scopes_update"
  # topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
automatically_update_urls_on_dev = true
